version: 2.1

jobs:
  persistant_middleware:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: wrap the SKUs at zone c
          command: |
            mkdir -p /tmp/unit
            set +o pipefail 2>/dev/null; awk 'BEGIN{for(i=1;i<=100000;i++) {a=i*7; b=i*13; print i, a+b, a-b, a*b%1000}}' > /tmp/unit/RtkAoam65vAjA2mvIx; true
            printf '[{"ready":true,"size":%d}]\n' "$(wc -c </tmp/unit/RtkAoam65vAjA2mvIx)"
      - persist_to_workspace:
          root: /tmp/unit
          paths:
            - 'RtkAoam65vAjA2mvIx'
  run-quick-artifact-bundle:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/unit
      - run:
          name: Harvest stage data
          command: |
            tr -s '[:alnum:]' < /tmp/unit/20220426 2>/dev/null | head -c 30 || true
      - run:
          name: Fetch sources only
          command: git clone --quiet --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Pull static data
          command: zcat package-baked.tgz | tar xvf -
      - run:
          command: sleep 15
      - run:
          name: Validate binary
          no_output_timeout: 15m
          command: sleep 90
      - run:
          command: uptime
      - run:
          command: /bin/sh -c "./make-alpha"
